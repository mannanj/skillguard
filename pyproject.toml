[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillguard"
version = "0.3.2"
description = "Scan Claude Code skills and MCP servers for malicious code — before Claude runs them."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only OR LicenseRef-Commercial"
license-files = ["LICENSE", "LICENSE-COMMERCIAL.md", "NOTICE"]
authors = [{ name = "Mannan Javid" }]
keywords = [
    "claude",
    "claude-code",
    "security",
    "scanner",
    "skills",
    "prompt-injection",
    "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
# Core scanner is intentionally zero-dependency (stdlib only).
dependencies = []

[project.optional-dependencies]
cisco = ["cisco-ai-skill-scanner"]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
skillguard = "skillguard.cli:main"
skillguard-hook = "skillguard.hook:main"

[project.urls]
Homepage = "https://github.com/mannanj/skillguard"
Repository = "https://github.com/mannanj/skillguard"
Issues = "https://github.com/mannanj/skillguard/issues"
Changelog = "https://github.com/mannanj/skillguard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["skillguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# tests/fixtures/ holds sample skill code the scanner analyzes (one fixture is
# deliberately malicious) — never lint or reformat it. force-exclude makes the
# pre-commit hook honor this even when it passes fixture paths explicitly.
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E), isort (I), pyupgrade (UP), bugbear (B)
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # don't fight existing long lines; reflow opportunistically

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # cisco / skill_scanner are optional extras
warn_unused_ignores = true
check_untyped_defs = true
